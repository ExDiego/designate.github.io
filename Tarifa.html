    document.addEventListener("DOMContentLoaded", function () {

        if (window.innerWidth <= 768) { // Solo en dispositivos móviles
          setTimeout(function () {
            offcanvas.hide();
          }, 2000); // 3 segundos
        }
      });
    });
  </script>
